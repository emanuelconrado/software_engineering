<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="../../css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <header class="hero">
    <div class="container">
      <h1 class="hero-title">Acessar Conta</h1>
      <p class="hero-subtitle">Entre para buscar opções de restaurantes!</p>
    </div>
  </header>

  <main class="main-content">
    <div class="form-container">
      <form id="loginForm" class="restaurant-form">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required />
        </div>

        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite sua senha" required />
        </div>

        <button type="button" id="loginButton" class="button button-primary">Entrar</button>
      </form>

      <p style="text-align: center; margin-top: 1rem;">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Plataforma de Restaurantes. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
<script type="module" src="auth.js"></script>
</html>
