<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanIEat? - Buscar Restaurantes</title>
    <link rel="stylesheet" href="../../css/restaurant_search.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Inclua os SDKs do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Cabeçalho (mesmo do index) -->
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🍽️</span>
                <h1>CanIEat?</h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="./restaurant_register.html">Cadastrar</a></li>
                    <li><a href="#" class="active">Buscar</a></li>
                    <li><a href="#">Contato</a></li>
                    <li><a href="#">Mapa</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Barra de Busca -->
<section class="search-section">
    <div class="container">
        <div class="search-box">
            <form id="searchForm">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Digite o nome do restaurante"
                    class="search-input"
                >
                <button type="submit" class="search-button">Buscar</button>
            </form>
        </div>
    </div>
</section>

<!-- Resultados da Busca -->
<section class="results-section">
    <div class="container">
        <h2>Restaurantes Disponíveis</h2>
        <div id="restaurantsList">
            <template id="restaurantTemplate">
                <div class="restaurant-card">
                    <h3 class="restaurant-title"></h3>
                    <div class="restaurant-details">
                        <p class="restaurant-address"></p>
                        <p class="restaurant-bairro"></p>
                        <p class="restaurant-cep"></p>
                        <p class="restaurant-restrictions"></p>
                    </div>
                    <div class="restaurant-actions">
                        <a href="#" class="restaurant-link">Ir até restaurante</a>
                    </div>
                </div>
            </template>
            <p class="loading-message">Carregando restaurantes...</p>
        </div>
    </div>
</section>

    <!-- Rodapé-->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2023 Registro de Restaurantes. Todos os direitos reservados.</p>
            <div class="footer-links">
                <a href="#">Termos de Uso</a>
                <a href="#">Política de Privacidade</a>
                <a href="#">Contato</a>
            </div>
        </div>
    </footer>
    <script type="module" src="../../api/firebase_config.js"></script>
    <script type="module" src="restaurant_search.js"></script>
</body>
</html>
