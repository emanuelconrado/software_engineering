<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CanIEat? - Avaliar Restaurante</title>
  <link rel="stylesheet" href="../../../css/reviews_search.css" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header class="main-header">
    <div class="container">
      <div class="logo">
        <h1>CanIEat?</h1>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="../../index.html">Início</a></li>
          <li><a href="../../pages/restaurant_search.html">Buscar Restaurante</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Avaliar Restaurante</h2>
    <form id="reviewForm">
        
      <label for="reviewRating">Nota (1 a 5):</label>
      <input type="number" id="reviewRating" min="1" max="5" required />

      <label for="reviewComment">Comentário:</label>
      <textarea id="reviewComment" rows="4" required></textarea>

      <button type="submit">Enviar Avaliação</button>
    </form>
    <p id="message"></p>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2023 CanIEat?. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="../../../api/firebase_config.js"></script>
  <script type="module" src="./reviews_search.js"></script>
</body>
</html>
